services:
  # ==========================================
  # Inventory Management Microservice API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/inventory_db?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-production_super_secret_jwt_key_2026}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - QUEUE_MAX_ATTEMPTS=4
      - QUEUE_BACKOFF_DELAY_MS=5000
      - LOW_STOCK_FOLLOWUP_DELAY_MS=7200000
      - SCHEDULED_INVENTORY_REPORT_CRON=0 0 * * *
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inventory_network

  # ==========================================
  # MongoDB Database (Single-Node Replica Set for ACID Transactions)
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: inventory_mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - inventory_network
    healthcheck:
      test: >
        mongosh --quiet --eval "
        try {
          rs.status();
        } catch (err) {
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'mongo:27017' }]
          });
        }
        db.runCommand('ping').ok
        "
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ==========================================
  # Redis Cache, Idempotency & BullMQ Message Queue
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: inventory_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - inventory_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  inventory_network:
    driver: bridge

